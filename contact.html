
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FreshFit</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="index.html">FreshFit</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About Us</a>
      <a href="reviews.html">Reviews</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-banner">
      <p class="eyebrow">WE'RE HERE TO HELP</p>
      <h1>Contact FreshFit</h1>
      <p>Have a question or suggestion? Send us a message.</p>
    </section>

    <section class="section narrow">
      <form id="contact-form" class="form-card">
        <label for="contact-name">Full name</label>
        <input id="contact-name" name="name" autocomplete="name" required>

        <label for="contact-email">Email address</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required>

        <label for="contact-subject">Subject</label>
        <select id="contact-subject" name="subject" required>
          <option value="">Choose a subject</option>
          <option>Product enquiry</option>
          <option>Order enquiry</option>
          <option>Feedback</option>
          <option>Other</option>
        </select>

        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>

        <button class="button" type="submit">Send Message</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="small-note">This demonstration form does not send messages to a real inbox.</p>
    </section>
  </main>

  <footer>
    <p>&copy; <span class="year"></span> FreshFit.</p>
  </footer>
</body>
</html>
